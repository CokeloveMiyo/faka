<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-labelledby="mfTitle">
  <title id="mfTitle">秒发卡铺 · 秒发凭据</title>
  <defs>
    <linearGradient id="mfGrad" x1="6" y1="8" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a90ff"/>
      <stop offset=".55" stop-color="#1f6bff"/>
      <stop offset="1" stop-color="#0f3fc4"/>
    </linearGradient>

    <!-- 票券外形：圆角矩形 + 左右各一个半圆撕口 -->
    <mask id="mfTicket">
      <rect x="4" y="9.5" width="40" height="29" rx="8" fill="#fff"/>
      <circle cx="4" cy="24" r="3.2" fill="#000"/>
      <circle cx="44" cy="24" r="3.2" fill="#000"/>
    </mask>
    <clipPath id="mfClip">
      <rect x="4" y="9.5" width="40" height="29" rx="8"/>
    </clipPath>

    <style>
      .mf-shine { animation: mfSweep 5.6s cubic-bezier(.4,0,.3,1) infinite; }
      .mf-bolt  { transform-box: fill-box; transform-origin: center;
                  animation: mfBolt 4.4s cubic-bezier(.4,0,.2,1) infinite; }
      .mf-perf  { stroke-dasharray: 1.8 3; animation: mfMarch 1.8s linear infinite; }
      .mf-spark { animation: mfSpark 2.6s cubic-bezier(.45,0,.55,1) infinite; }

      @keyframes mfSweep {
        0%, 42%   { transform: translateX(0); }
        80%, 100% { transform: translateX(70px); }
      }
      @keyframes mfBolt {
        0%, 58%, 100% { opacity: 1; transform: scale(1); }
        64%           { opacity: .45; transform: scale(.92); }
        71%           { opacity: 1; transform: scale(1.06); }
        78%           { transform: scale(1); }
      }
      @keyframes mfMarch { to { stroke-dashoffset: -9.6; } }
      @keyframes mfSpark {
        0%, 48%  { opacity: 0; transform: translateY(0); }
        56%      { opacity: .95; }
        88%      { opacity: .95; }
        100%     { opacity: 0; transform: translateY(17px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mf-shine, .mf-bolt, .mf-perf, .mf-spark { animation: none; }
        .mf-spark { opacity: 0; }
      }
    </style>
  </defs>

  <g mask="url(#mfTicket)">
    <rect x="4" y="9.5" width="40" height="29" fill="url(#mfGrad)"/>

    <!-- 斜向光带扫过（出票时的一道反光） -->
    <g transform="rotate(18 24 24)" clip-path="url(#mfClip)">
      <g class="mf-shine"><rect x="-10" y="-6" width="7.5" height="60" fill="#fff" opacity=".4"/></g>
    </g>

    <!-- 齿孔虚线：向下流动，像凭据正在被打印出来 -->
    <line class="mf-perf" x1="33.5" y1="13" x2="33.5" y2="35"
          stroke="#fff" stroke-opacity=".85" stroke-width="1.7" stroke-linecap="round"/>

    <!-- 一枚光点沿齿孔滑出（卡密出库） -->
    <circle class="mf-spark" cx="33.5" cy="13.2" r="1.5" fill="#fff" opacity="0"/>

    <!-- 闪电：秒发 -->
    <path class="mf-bolt" d="M20.6 12.4 L12.2 24.9 H18.1 L15.6 31.6 L25.2 18.9 H19.4 Z"
          fill="#fff" stroke="#fff" stroke-width=".9" stroke-linejoin="round"/>
  </g>
</svg>
